<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Parcelamento</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-center mb-4">Simulador de Parcelamento</h1>
        <div class="mb-4">
            <label for="valor" class="block text-sm font-medium text-gray-700">Valor da Compra (R$)</label>
            <input type="number" id="valor" class="mt-1 p-2 w-full border rounded-md" placeholder="Ex: 1000" step="0.01" min="0">
        </div>
        <div class="mb-4">
            <label for="bandeira" class="block text-sm font-medium text-gray-700">Bandeira do Cartão</label>
            <select id="bandeira" class="mt-1 p-2 w-full border rounded-md" onchange="atualizarTaxas()">
                <option value="visa_mastercard">Visa/Mastercard</option>
                <option value="elo_outras">Elo/Outras</option>
            </select>
        </div>
        <div class="mb-4">
            <label for="parcelas" class="block text-sm font-medium text-gray-700">Número de Parcelas</label>
            <select id="parcelas" class="mt-1 p-2 w-full border rounded-md">
                <option value="1">1x</option>
                <option value="2">2x</option>
                <option value="3">3x</option>
                <option value="4">4x</option>
                <option value="5">5x</option>
                <option value="6">6x</option>
                <option value="7">7x</option>
                <option value="8">8x</option>
                <option value="9">9x</option>
                <option value="10">10x</option>
                <option value="11">11x</option>
                <option value="12">12x</option>
                <option value="13">13x</option>
                <option value="14">14x</option>
                <option value="15">15x</option>
                <option value="16">16x</option>
                <option value="17">17x</option>
                <option value="18">18x</option>
            </select>
        </div>
        <button onclick="calcular()" class="w-full bg-blue-600 text-white p-2 rounded-md hover:bg-blue-700">Calcular</button>
        <div id="resultado" class="mt-4 text-center"></div>
    </div>

    <script>
        const taxas = {
            visa_mastercard: {
                1: 2.93,
                2: 4.27,
                3: 5.00,
                4: 5.72,
                5: 6.44,
                6: 7.14,
                7: 7.71,
                8: 8.41,
                9: 9.09,
                10: 9.78,
                11: 10.45,
                12: 11.11,
                13: 11.78,
                14: 12.43,
                15: 13.08,
                16: 13.72,
                17: 14.36,
                18: 14.99
            },
            elo_outras: {
                1: 3.24,
                2: 4.47,
                3: 5.00,
                4: 5.72,
                5: 6.64,
                6: 7.34,
                7: 7.91,
                8: 8.61,
                9: 9.29,
                10: 9.98,
                11: 10.65,
                12: 11.31,
                13: 11.98,
                14: 12.63,
                15: 13.28,
                16: 13.92,
                17: 14.56,
                18: 15.19
            }
        };

        function atualizarTaxas() {
            // Função mantida para futura expansão
        }

        function calcular() {
            const valor = parseFloat(document.getElementById('valor').value);
            const bandeira = document.getElementById('bandeira').value;
            const parcelas = parseInt(document.getElementById('parcelas').value);
            const resultadoDiv = document.getElementById('resultado');

            if (isNaN(valor) || valor <= 0) {
                resultadoDiv.innerHTML = '<p class="text-red-500">Por favor, insira um valor válido.</p>';
                return;
            }

            const juros = taxas[bandeira][parcelas] / 100;

            // Cálculo de juros simples: M = C + (C * i)
            const montante = valor + (valor * juros);
            const valorParcela = montante / parcelas;

            resultadoDiv.innerHTML = `
                <p><strong>Valor da Parcela:</strong> R$ ${valorParcela.toFixed(2)}</p>
                <p><strong>Total com a Taxa:</strong> R$ ${montante.toFixed(2)}</p>
                <p><strong>Parcelas:</strong> ${parcelas}x</p>
                <p><strong>Bandeira:</strong> ${bandeira === 'visa_mastercard' ? 'Visa/Mastercard' : 'Elo/Outras'}</p>
            `;
        }
    </script>
</body>
</html>
